[package]
name = "odx-desktop"
version = "1.10.4"
description = "Desktop UI for the ODX PDX/MDD converter and parser"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
indexmap = { version = "1.9.3", features = ["std"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3.3"
lzma-rs = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["fs", "io-util", "time", "rt", "net"] }
doip_rw = "0.1.0"
doip_rw_tokio = "0.1.1"
odx_converter = { package = "odx-converter-rs", path = "vendor/odx-converter-rs" }

[[bin]]
name = "odx-desktop"
path = "src/main.rs"
