[package]
name = "odx-converter-rs"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of an ODX (ISO-22091) to MDD converter for automotive ECU diagnostic descriptions"
license = "Apache-2.0"
keywords = ["automotive", "odx", "sovd", "diagnostic", "ecu"]
categories = ["command-line-utilities", "encoding"]

[[bin]]
name = "odx-converter"
path = "src/main.rs"

[lib]
name = "odx_converter"
path = "src/lib.rs"

[dependencies]
# CLI
clap = { version = "=4.5.4", features = ["derive"] }

# Compression
# xz2/liblzma is used for high-ratio LZMA-Alone encoding.
# lzma-rs remains for the existing pure-Rust decoder path.
xz2 = "0.1.7"
lzma-rs = "0.3"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# XML parsing – roxmltree avoids serde/namespace complexity in ODX files
roxmltree = "0.20"

# ZIP / PDX parsing
zip = { version = "2", default-features = false, features = ["deflate"] }

# Parallel processing
rayon = "1"

# Protocol Buffers (MDD container format)
prost = "0.13"

# FlatBuffers (MDD diagnostic description payload)
# Pinned to the 2.x series for compatibility with the installed flatc/cargo
# toolchain (see project notes) — the hand-rolled builder calls
# (start_table/push_slot_always/end_table/Table/ForwardsUOffset/Vector) are
# stable, long-standing parts of the flatbuffers crate API present in 2.x too.
flatbuffers = "2"

# Compression plugins
zstd = "0.13"
lz4_flex = "=0.10.0"

# Misc
chrono = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
regex = "1"
sha2 = "0.10"

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
